

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Finance Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/site.css?v=f3mldLQ1gv6YCS_Z04gTl_lsj9Dt8feXAREDnGcp4vE" rel="stylesheet" />
    <link href="/css/dashboard.css?v=jmyoIHeA1NsxHcWYeipilp7b3c0PueJWUoVSS-ekX0E" rel="stylesheet" />
</head>
<body class="login-page">
    <div class="login-card fade-in">
        <div class="login-logo">
            <i class="bi bi-bank2"></i>
            <h3>Finance Department Punjab</h3>
            <p class="mb-0">Budget Analysis Dashboard</p>
        </div>

        <form method="post" autocomplete="off" action="/Account/Login">
            
            

            <div class="mb-3">
                <label class="form-label" for="Email">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input class="form-control" placeholder="Enter your email" autofocus type="text" data-val="true" data-val-required="The Email field is required." id="Email" name="Email" value="" />
                </div>
                <span class="text-danger small field-validation-valid" data-valmsg-for="Email" data-valmsg-replace="true"></span>
            </div>

            <div class="mb-3">
                <label class="form-label" for="Password">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" placeholder="Enter your password" data-val="true" data-val-required="The Password field is required." id="Password" name="Password" />
                    <button class="btn btn-outline-secondary" type="button" onclick="togglePassword(this)">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
                <span class="text-danger small field-validation-valid" data-valmsg-for="Password" data-valmsg-replace="true"></span>
            </div>

            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" data-val="true" data-val-required="The RememberMe field is required." id="RememberMe" name="RememberMe" value="true" />
                <label class="form-check-label" for="RememberMe">Remember me</label>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                </button>
            </div>

            <div class="mt-3 text-center">
                <small class="text-muted">
                    Default: admin@finance.punjab.gov.pk / Admin@123
                </small>
            </div>
        <input name="__RequestVerificationToken" type="hidden" value="CfDJ8FwA7EdPltRFtjf1JqatMRiq4QSuH5lobqJ7m3DUjdvH-6ULo_y0iBBC26iW1YDVCjg6cQfqRWOoVKp0nBvhHxxHWO0CAUqc_6WwbNNYpSO5FYlOnVghex9MvfLaq5iyTRzqWZAb4mPGnlEIcqMgddY" /><input name="RememberMe" type="hidden" value="false" /></form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function togglePassword(btn) {
            const input = btn.parentElement.querySelector('input');
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('bi-eye', 'bi-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('bi-eye-slash', 'bi-eye');
            }
        }
    </script>
</body>
</html>
